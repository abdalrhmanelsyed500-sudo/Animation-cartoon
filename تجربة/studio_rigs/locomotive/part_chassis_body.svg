<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <!-- Rear Tool Deck -->
  <rect x="65" y="268" width="620" height="24" rx="8" fill="#6E4423" stroke="#231915" stroke-width="5"/>
  <!-- Red Metal Toolbox (also available separately) -->
  <rect x="78" y="212" width="78" height="56" rx="8" fill="#C83E37" stroke="#231915" stroke-width="4.5"/>
  <rect x="108" y="232" width="18" height="16" rx="3" fill="#E0A846" stroke="#231915" stroke-width="3"/>
  <!-- Main Oak Cabin Body (with cutout windows using fill-rule="evenodd") -->
  <path fill-rule="evenodd" d="
    M 160 95 L 495 95 L 495 270 L 160 270 Z
    M 185 122 L 272 122 L 272 200 L 185 200 Z
    M 292 122 L 378 122 L 378 200 L 292 200 Z
    M 398 122 L 475 122 L 475 200 L 398 200 Z
  " fill="#9C6436" stroke="#231915" stroke-width="5" stroke-linejoin="round"/>
  <!-- Semi-transparent glass sheen over windows -->
  <rect x="185" y="122" width="87" height="78" fill="#A8E0F0" opacity="0.28"/>
  <rect x="292" y="122" width="86" height="78" fill="#A8E0F0" opacity="0.28"/>
  <rect x="398" y="122" width="77" height="78" fill="#A8E0F0" opacity="0.28"/>
  <!-- Petrol-Blue Steel Framing & Brass Rivets -->
  <rect x="160" y="95" width="335" height="16" fill="#24586B" stroke="#231915" stroke-width="4"/>
  <rect x="160" y="252" width="505" height="18" fill="#24586B" stroke="#231915" stroke-width="4"/>
  <!-- Rounded Curved Roof -->
  <path d="M 145 96 Q 325 66 512 96 Z" fill="#24586B" stroke="#231915" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front Cylindrical Boiler Nose -->
  <path d="M 495 142 L 642 142 Q 668 205 642 254 L 495 254 Z" fill="#8B562A" stroke="#231915" stroke-width="5" stroke-linejoin="round"/>
  <rect x="555" y="142" width="18" height="112" fill="#24586B" stroke="#231915" stroke-width="4"/>
  <rect x="625" y="142" width="18" height="112" fill="#24586B" stroke="#231915" stroke-width="4"/>
  <!-- Brass Chimney -->
  <rect x="578" y="72" width="30" height="70" rx="5" fill="#E0A846" stroke="#231915" stroke-width="4.5"/>
  <rect x="572" y="64" width="42" height="12" rx="4" fill="#E0A846" stroke="#231915" stroke-width="4"/>
  <!-- Front Headlights -->
  <circle cx="658" cy="232" r="20" fill="#FFF3B0" stroke="#231915" stroke-width="4.5"/>
  <circle cx="658" cy="232" r="13" fill="#FFFFFF"/>
</svg>